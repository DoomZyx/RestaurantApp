# Exécuter depuis ce dossier deploy/ : docker compose --env-file ../../.env up -d
# (Arborescence attendue : .../backend, .../frontend, .../frontend/deploy/*.)

services:
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: smartcrm-backend
    restart: unless-stopped
    env_file: ../../.env
    environment:
      NODE_ENV: production
      PORT: 3000
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: smartcrm-frontend
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    container_name: smartcrm-7caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

volumes:
  caddy_data:
  caddy_config:
