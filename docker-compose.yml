version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hh-backend
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      - NODE_ENV=production
      - PORT=8080
      - VIRTUAL_HOST=app.api.mysmartfood.fr
      - VIRTUAL_PORT=8080
      - LETSENCRYPT_HOST=app.api.mysmartfood.fr
      - LETSENCRYPT_EMAIL=tech@mysmartfood.fr
    expose:
      - "8080"
    networks:
      - nginx-proxy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  nginx-proxy:
    external: true